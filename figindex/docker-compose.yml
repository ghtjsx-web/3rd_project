services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: figindex-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' -- || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: figindex-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - CROPS_DIR=/data/crops
      - PDFS_DIR=/data/pdfs
    volumes:
      - ./backend/app:/app/app
      - ./data:/data
      - ./shared:/app/shared
    depends_on:
      qdrant:
        condition: service_healthy

  pipeline:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: figindex-pipeline
    profiles:
      - index
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - CROPS_DIR=/data/crops
      - PDFS_DIR=/data/pdfs
    volumes:
      - ./pipeline:/app
      - ./data:/data
      - ./shared:/app/shared
      - ./data/model_cache:/root/.cache
    depends_on:
      qdrant:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: figindex-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

