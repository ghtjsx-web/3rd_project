services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: figindex-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' -- || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: figindex-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app --reload-dir /app/shared
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_MODE=server
      - QDRANT_URL=http://qdrant:6333
      - CROPS_DIR=/data/crops
      - PDFS_DIR=/data/pdfs
      - WATCHFILES_FORCE_POLLING=true
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
    volumes:
      - ./backend/app:/app/app
      - ./data:/data
      - ./shared:/app/shared
    depends_on:
      qdrant:
        condition: service_healthy

  pipeline:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: figindex-pipeline
    profiles:
      - index
    env_file:
      - .env
    environment:
      - QDRANT_MODE=server
      - QDRANT_URL=http://qdrant:6333
      - CROPS_DIR=/data/crops
      - PDFS_DIR=/data/pdfs
    volumes:
      - ./pipeline:/app
      - ./data:/data
      - ./shared:/app/shared
      - ./data/model_cache:/root/.cache
      - ../scripts:/scripts
    depends_on:
      qdrant:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: figindex-frontend
    restart: unless-stopped
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

